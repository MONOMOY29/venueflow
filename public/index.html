<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>VenueFlow — Smart Venue Navigator</title>
  <style>
    :root {
      --bg: #050810;
      --surface: #0c1220;
      --surface2: #111927;
      --border: rgba(255,255,255,0.08);
      --accent: #3de8c0;
      --accent2: #63d2ff;
      --accent3: #ff5e62;
      --amber: #ffbb38;
      --text: #e8f0fe;
      --text-muted: #7a8ba8;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 14px;
      min-height: 100vh;
    }
    .app {
      max-width: 1200px;
      margin: 0 auto;
      padding: 16px;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
    }
    .logo { font-size: 1.2rem; font-weight: bold; color: var(--text); text-decoration: none; }
    .logo span { color: var(--accent); }
    .status { background: rgba(61,232,192,0.1); color: var(--accent); border: 1px solid rgba(61,232,192,0.3); padding: 4px 10px; border-radius: 14px; font-size: 11px; }
    .main {
      display: grid;
      grid-template-columns: 340px 1fr;
      gap: 16px;
      margin-top: 16px;
      flex: 1;
    }
    @media (max-width: 800px) { .main { grid-template-columns: 1fr; } }
    .panel {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      overflow: hidden;
      margin-bottom: 14px;
    }
    .panel-head {
      padding: 10px 14px;
      background: rgba(255,255,255,0.02);
      border-bottom: 1px solid var(--border);
      font-size: 11px;
      font-weight: 600;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .map-box { height: 180px; display: flex; align-items: center; justify-content: center; background: #080c14; }
    .gate-card {
      background: var(--surface2);
      border: 1px solid var(--border);
      padding: 8px 12px;
      border-radius: 6px;
      margin: 8px 10px;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
    .gate-card:hover { border-color: var(--accent2); }
    .chat-box {
      display: flex;
      flex-direction: column;
      height: calc(100vh - 100px);
      min-height: 500px;
    }
    .chat-messages {
      flex: 1;
      padding: 16px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .welcome { text-align: center; margin: auto; max-width: 400px; }
    .welcome h2 { font-size: 1.1rem; margin-bottom: 6px; }
    .welcome p { color: var(--text-muted); font-size: 13px; margin-bottom: 14px; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
    .chip {
      background: var(--surface2);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 6px 12px;
      border-radius: 16px;
      font-size: 12px;
      cursor: pointer;
    }
    .chip:hover { border-color: var(--accent); color: var(--accent); }
    .msg { display: flex; gap: 8px; max-width: 85%; }
    .msg.user { align-self: flex-end; flex-direction: row-reverse; }
    .msg.bot { align-self: flex-start; }
    .bubble {
      padding: 10px 14px;
      border-radius: 10px;
      font-size: 13px;
      line-height: 1.5;
    }
    .msg.user .bubble { background: rgba(61,232,192,0.15); border: 1px solid rgba(61,232,192,0.3); color: #fff; }
    .msg.bot .bubble { background: var(--surface2); border: 1px solid var(--border); }
    .chat-input {
      padding: 12px 16px;
      background: var(--surface);
      border-top: 1px solid var(--border);
      display: flex;
      gap: 8px;
    }
    .chat-input input {
      flex: 1;
      background: var(--surface2);
      border: 1px solid var(--border);
      color: #fff;
      padding: 8px 12px;
      border-radius: 8px;
      outline: none;
    }
    .chat-input input:focus { border-color: var(--accent2); }
    .chat-input button {
      background: linear-gradient(135deg, var(--accent), var(--accent2));
      border: none;
      color: #000;
      padding: 0 16px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }
  </style>
</head>
<body>
<div class="app">
  <header>
    <a href="/" class="logo">??? Venue<span>Flow</span></a>
    <div class="status">LIVE ARENA RADAR</div>
  </header>

  <div class="main">
    <aside>
      <div class="panel">
        <div class="panel-head">Tactical Concourse Map</div>
        <div class="map-box">
          <svg viewBox="0 0 300 160" style="width: 100%; height: 100%;">
            <ellipse cx="150" cy="80" rx="120" ry="65" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="6"/>
            <ellipse cx="150" cy="80" rx="70" ry="38" fill="#0b1322" stroke="rgba(61,232,192,0.3)" stroke-width="2"/>
            <ellipse cx="150" cy="80" rx="35" ry="18" fill="#042318" stroke="#3de8c0" stroke-width="1.2"/>
            <text x="150" y="83" text-anchor="middle" fill="#3de8c0" font-size="8">ARENA FIELD</text>
            <circle class="gate-node" data-q="How crowded is North Gate 1?" cx="120" cy="18" r="7" fill="#ff5e62" style="cursor:pointer;" />
            <circle class="gate-node" data-q="Can I use South Gate 5?" cx="120" cy="142" r="7" fill="#3de8c0" style="cursor:pointer;" />
            <circle class="gate-node" data-q="Is West Gate 12 clear?" cx="32" cy="80" r="7" fill="#3de8c0" style="cursor:pointer;" />
            <circle class="gate-node" data-q="What is the wait time at East Gate 9?" cx="268" cy="80" r="7" fill="#ff5e62" style="cursor:pointer;" />
          </svg>
        </div>
      </div>

      <div class="panel">
        <div class="panel-head">Live Gate Wait Times</div>
        <div id="gateList"><div style="padding:10px;text-align:center;color:var(--text-muted);">Loading gates...</div></div>
      </div>
    </aside>

    <main class="panel chat-box">
      <div class="panel-head">AI Egress Assistant</div>
      <div class="chat-messages" id="chatBox">
        <div class="welcome" id="welcomeView">
          <h2>??? Grand Arena Navigator</h2>
          <p>Real-time crowd routing and transit dispatching. Choose a prompt or type below:</p>
          <div class="chips">
            <button class="chip" data-q="Where is the quickest exit right now?">Quickest exit?</button>
            <button class="chip" data-q="What is the queue for the Blue Line metro?">Metro queue?</button>
            <button class="chip" data-q="I am in North Stand. Which gate is best?">North Stand help</button>
            <button class="chip" data-q="When should I leave to beat the rush?">When to leave?</button>
          </div>
        </div>
      </div>

      <div class="chat-input">
        <input id="inputBox" type="text" placeholder="Ask about exits, transit, gates..." autocomplete="off" />
        <button id="sendBtn" type="button">Send</button>
      </div>
    </main>
  </div>
</div>

<script>
  let sid = localStorage.getItem("vf_sid") || null;

  function addMsg(txt, sender) {
    const welcome = document.getElementById("welcomeView");
    if (welcome) welcome.style.display = "none";
    const box = document.getElementById("chatBox");
    const d = document.createElement("div");
    d.className = "msg " + sender;
    d.innerHTML = '<div class="bubble">' + txt + '</div>';
    box.appendChild(d);
    box.scrollTop = box.scrollHeight;
  }

  async function send(query) {
    if (!query || !query.trim()) return;
    const clean = query.trim();
    addMsg(clean, "user");

    const input = document.getElementById("inputBox");
    input.value = "";
    input.focus();

    const box = document.getElementById("chatBox");
    const loader = document.createElement("div");
    loader.className = "msg bot";
    loader.id = "loader";
    loader.innerHTML = '<div class="bubble" style="opacity:0.6;">Finding best route...</div>';
    box.appendChild(loader);
    box.scrollTop = box.scrollHeight;

    try {
      const res = await fetch("/api/chat", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message: clean, sessionId: sid })
      });
      const data = await res.json();
      loader.remove();

      if (res.ok) {
        if (data.sessionId) {
          sid = data.sessionId;
          localStorage.setItem("vf_sid", sid);
        }
        addMsg(data.reply, "bot");
      } else {
        addMsg("?? " + (data.error || "Unable to navigate right now."), "bot");
      }
    } catch (err) {
      loader.remove();
      addMsg("?? Network error communicating with server.", "bot");
    }
  }

  async function loadGates() {
    try {
      const res = await fetch("/api/venue/status");
      if (!res.ok) return;
      const data = await res.json();
      const list = document.getElementById("gateList");
      if (!list || !data.gates) return;

      list.innerHTML = data.gates.map(g => {
        return '<div class="gate-card" data-q="How do I reach ' + g.name + '?">' +
               '<div><strong>' + g.name + '</strong><div style="font-size:11px;color:#7a8ba8;">' + g.section + '</div></div>' +
               '<div style="font-size:11px;color:' + (g.waitMinutes > 10 ? '#ff5e62' : '#3de8c0') + '">' + g.waitMinutes + 'm wait</div>' +
               '</div>';
      }).join("");

      list.querySelectorAll(".gate-card").forEach(c => {
        c.onclick = () => send(c.getAttribute("data-q"));
      });
    } catch (e) {
      console.error(e);
    }
  }

  document.addEventListener("DOMContentLoaded", () => {
    const input = document.getElementById("inputBox");
    const btn = document.getElementById("sendBtn");

    btn.onclick = () => send(input.value);
    input.onkeydown = (e) => {
      if (e.key === "Enter") {
        e.preventDefault();
        send(input.value);
      }
    };

    document.querySelectorAll(".chip").forEach(c => {
      c.onclick = () => send(c.getAttribute("data-q"));
    });

    document.querySelectorAll(".gate-node").forEach(n => {
      n.onclick = () => send(n.getAttribute("data-q"));
    });

    loadGates();
    setInterval(loadGates, 15000);
  });
</script>
</body>
</html>
